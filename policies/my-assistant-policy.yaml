          method: POST
          path: /api/*/envelope/**
      - allow:
          method: POST
          path: /api/*/store/**
    - host: claude.ai
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: /install.sh
    - host: downloads.claude.ai
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: /claude-code-releases/**
    - host: platform.claude.com
