version: 1
filesystem_policy:
  include_workdir: true
  read_only:
  - /usr
  - /lib
  - /proc
  - /dev/urandom
  - /app
  - /etc
  - /var/log
  - /run/nvidia-persistenced
  read_write:
  - /tmp
  - /dev/null
  - /sandbox/.openclaw
  - /sandbox/.nemoclaw
  - /sandbox
  - /dev/nvidiactl
  - /dev/nvidia-uvm
  - /dev/nvidia-uvm-tools
  - /dev/nvidia-modeset
  - /dev/nvidia0
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  allow_api_aiq_nvidia_com_443:
    name: allow_api_aiq_nvidia_com_443
    endpoints:
    - host: api.aiq.nvidia.com
      port: 443
      access: full
      tls: skip
      allowed_ips:
      - 10.84.237.61
    binaries:
    - path: /usr/bin/curl
    - path: /usr/bin/python3.11
  brave:
    name: brave
    endpoints:
    - host: api.search.brave.com
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: /**
      - allow:
          method: POST
          path: /**
    binaries:
    - path: /usr/local/bin/node
    - path: /usr/bin/node
  brew:
    name: brew
    endpoints:
    - host: formulae.brew.sh
      port: 443
      tls: skip
      access: full
    - host: github.com
      port: 443
      tls: skip
      access: full
    - host: ghcr.io
      port: 443
      tls: skip
      access: full
    - host: pkg-containers.githubusercontent.com
